name: Android Release Artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: Optional public Instagram post/Reel URL for live Android sharing and offline-playback validation
        required: false
        type: string
      artifact_run_id:
        description: Optional successful run of this workflow at this exact commit to reuse verified APKs for device-only validation
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npx expo-doctor@latest
      - run: npm run typecheck
      - run: npm test
      - name: Use preinstalled Chrome for Playwright
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No preinstalled Chrome or Chromium found on runner."
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-checks
          path: |
            artifacts/screenshots
            test-results
          if-no-files-found: ignore
      - run: npm run build:web -- --max-workers 2
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: npm run build:android-release
      - name: Native provider and transfer policy unit tests
        run: cd android && ./gradlew :app:testReleaseUnitTest --max-workers=2 --no-daemon '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Build local Cast device tests
        run: cd android && ./gradlew :app:assembleReleaseAndroidTest --max-workers=2 --no-daemon '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-local-cast-tests
          path: android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify Android release artifacts
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Harmonia-Player-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Harmonia-Player-universal.apk
          jarsigner -verify artifacts/Harmonia-Player.aab
          python3 - <<'PYCODE'
          import zipfile

          expected = {'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'}

          def apk_abis(path):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  abis = {
                      name.split('/')[1]
                      for name in names
                      if name.startswith('lib/') and len(name.split('/')) > 2
                  }
                  assert archive.getinfo('assets/index.android.bundle').file_size > 0
                  dex = b''.join(archive.read(name) for name in names if name.endswith('.dex'))
                  assert b'Lcom/alhudar/harmonia/youtube/YouTubeModule;' in dex, 'Missing native YouTube bridge'
                  assert b'Lorg/schabi/newpipe/extractor/NewPipe;' in dex, 'Missing NewPipe Extractor'
                  return abis

          assert apk_abis('artifacts/Harmonia-Player-arm64.apk') == {'arm64-v8a'}
          assert apk_abis('artifacts/Harmonia-Player-universal.apk') == expected

          with zipfile.ZipFile('artifacts/Harmonia-Player.aab') as bundle:
              names = bundle.namelist()
              abis = {
                  name.split('/')[2]
                  for name in names
                  if name.startswith('base/lib/') and len(name.split('/')) > 3
              }
              assert abis == expected, abis
              assert 'base/assets/index.android.bundle' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-arm64
          path: artifacts/Harmonia-Player-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-universal
          path: artifacts/Harmonia-Player-universal.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-aab
          path: artifacts/Harmonia-Player.aab
          if-no-files-found: error
          retention-days: 14

  android-share-smoke:
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate reusable artifact provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HARMONIA_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$HARMONIA_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HARMONIA_ARTIFACT_RUN_ID" > "$RUNNER_TEMP/harmonia-source-run.json"
          python3 - <<'PYCODE'
          import json,os,pathlib
          source=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'harmonia-source-run.json').read_text())
          assert source['head_sha']==os.environ['GITHUB_SHA'], 'Artifact source must match the checked-out commit'
          assert source['conclusion']=='success', 'Only successful source runs may be reused'
          assert source['path']=='.github/workflows/android-apk.yml', 'Unexpected source workflow'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: Harmonia-Player-universal
          path: artifacts
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Harmonia-Player-local-cast-tests
          path: artifacts/local-cast-tests
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM for emulator
        # The local Cast tests use the same release APK and require no live Cast receiver.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r artifacts/Harmonia-Player-universal.apk
            python3 scripts/test-android-share.py
            python3 scripts/test-instagram-share.py
            python3 scripts/test-android-local-cast.py
        env:
          HARMONIA_INSTAGRAM_SMOKE_URL: ${{ inputs.instagram_url || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-share-smoke-diagnostics
          path: artifacts/android-smoke
          if-no-files-found: ignore

  windows-script:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell build script
        shell: pwsh
        run: |
          $parseErrors=$null
          $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/build-android-release.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'PowerShell syntax validation failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Windows Android toolchain
        shell: pwsh
        run: |
          sdkmanager.bat 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw 'Android toolchain installation failed' }
      - name: Build standalone ARM64 APK with native PowerShell script
        shell: pwsh
        run: ./scripts/build-android-release.ps1 -Mode arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-Windows-arm64
          path: artifacts/Harmonia-Player-arm64.apk
          if-no-files-found: error
          retention-days: 14
