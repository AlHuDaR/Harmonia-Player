name: Android Release Artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - run: npx expo-doctor@latest
      - run: npm run typecheck
      - run: npm test
      - name: Use preinstalled Chrome for Playwright
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No preinstalled Chrome or Chromium found on runner."
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-checks
          path: |
            artifacts/screenshots
            test-results
          if-no-files-found: ignore
      - run: npm run build:web -- --max-workers 2
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: npm run build:android-release
      - name: Native provider and transfer policy unit tests
        run: cd android && ./gradlew :app:testReleaseUnitTest --max-workers=2 --no-daemon '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify Android release artifacts
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Harmonia-Player-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Harmonia-Player-universal.apk
          jarsigner -verify artifacts/Harmonia-Player.aab
          python3 - <<'PYCODE'
          import zipfile

          expected = {'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'}

          def apk_abis(path):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  abis = {
                      name.split('/')[1]
                      for name in names
                      if name.startswith('lib/') and len(name.split('/')) > 2
                  }
                  assert archive.getinfo('assets/index.android.bundle').file_size > 0
                  dex = b''.join(archive.read(name) for name in names if name.endswith('.dex'))
                  assert b'Lcom/alhudar/harmonia/youtube/YouTubeModule;' in dex, 'Missing native YouTube bridge'
                  assert b'Lorg/schabi/newpipe/extractor/NewPipe;' in dex, 'Missing NewPipe Extractor'
                  return abis

          assert apk_abis('artifacts/Harmonia-Player-arm64.apk') == {'arm64-v8a'}
          assert apk_abis('artifacts/Harmonia-Player-universal.apk') == expected

          with zipfile.ZipFile('artifacts/Harmonia-Player.aab') as bundle:
              names = bundle.namelist()
              abis = {
                  name.split('/')[2]
                  for name in names
                  if name.startswith('base/lib/') and len(name.split('/')) > 3
              }
              assert abis == expected, abis
              assert 'base/assets/index.android.bundle' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-arm64
          path: artifacts/Harmonia-Player-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-universal
          path: artifacts/Harmonia-Player-universal.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-aab
          path: artifacts/Harmonia-Player.aab
          if-no-files-found: error
          retention-days: 14

  android-share-smoke:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: Harmonia-Player-universal
          path: artifacts
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r artifacts/Harmonia-Player-universal.apk
            python3 scripts/test-android-share.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-share-smoke-diagnostics
          path: artifacts/android-smoke
          if-no-files-found: ignore

  windows-script:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell build script
        shell: pwsh
        run: |
          $parseErrors=$null
          $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/build-android-release.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'PowerShell syntax validation failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Windows Android toolchain
        shell: pwsh
        run: |
          sdkmanager.bat 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          if ($LASTEXITCODE -ne 0) { throw 'Android toolchain installation failed' }
      - name: Build standalone ARM64 APK with native PowerShell script
        shell: pwsh
        run: ./scripts/build-android-release.ps1 -Mode arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Player-Windows-arm64
          path: artifacts/Harmonia-Player-arm64.apk
          if-no-files-found: error
          retention-days: 14
